# For local development only.

services:
    niden-net-astro:
        container_name: niden-net-astro
        hostname: niden-net-astro
        image: node:22-alpine
        working_dir: /app
        volumes:
            - .:/app
        ports:
            - "4321:4321"
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --force"
