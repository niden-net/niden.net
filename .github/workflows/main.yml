name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# The deploy step pushes the built site to another branch.
permissions:
  contents: write

env:
  # The branch Cloudflare Pages serves. It holds the built site only.
  DEPLOY_BRANCH: production

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the content parses as MDX
        run: |
          node mdx-lint.mjs
          node mdx-lint.mjs src/content/pages

      - name: Check types
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Publish to the deploy branch
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        # dist/_redirects (copied from public/) carries the archive, pagination
        # and legacy redirects, so the deployment is self-contained.
        run: |
          git config user.name niden
          git config user.email nikos@niden.net

          if git ls-remote --exit-code --heads origin "${DEPLOY_BRANCH}" > /dev/null 2>&1; then
              git fetch --no-tags --prune --depth=1 \
                  origin "+refs/heads/${DEPLOY_BRANCH}:refs/remotes/origin/${DEPLOY_BRANCH}"
              git worktree add ../deploy "origin/${DEPLOY_BRANCH}"
          else
              echo "${DEPLOY_BRANCH} does not exist yet; starting it"
              git worktree add --detach ../deploy
              git -C ../deploy checkout --orphan "${DEPLOY_BRANCH}"
              git -C ../deploy rm -rf --quiet . || true
          fi

          rsync -a --delete --exclude .git dist/ ../deploy/
          touch ../deploy/.nojekyll
          git -C ../deploy add -A
          git -C ../deploy commit -m "Deployed ${GITHUB_SHA::7}" || echo "No changes to deploy"
          git -C ../deploy push origin "HEAD:${DEPLOY_BRANCH}"
